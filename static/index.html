<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Event Monitor</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/d3-geo.v3.min.js"></script>
    <script src="https://d3js.org/topojson.v3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;500;700&display=swap');
        
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #151b3d;
            --bg-card: #1a2140;
            --accent-primary: #00d9ff;
            --accent-secondary: #7b2cbf;
            --accent-danger: #ff006e;
            --accent-success: #06ffa5;
            --text-primary: #e6e8f0;
            --text-secondary: #8892b0;
            --border-color: #2d3561;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1444 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--border-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }
        
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        
        header {
            margin-bottom: 3rem;
            animation: slideDown 0.6s ease-out;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .header-content {
            flex: 1;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 300;
        }
        
        .controls {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .control-group label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        select {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 250px;
        }
        
        select:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.1);
        }
        
        select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.2);
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--bg-card);
            border-radius: 8px;
            border: 2px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            white-space: nowrap;
            margin-top: 0.5rem;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-danger);
            animation: pulse 2s ease-in-out infinite;
        }
        
        .status-dot.connected {
            background: var(--accent-success);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .stat-card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-primary);
            box-shadow: 0 10px 40px rgba(0, 217, 255, 0.15);
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-primary);
        }
        
        .visualization-card {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            margin-bottom: 2rem;
            animation: fadeIn 1s ease-out 0.4s both;
        }
        
        .visualization-card h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .visualization-card h2::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 2px;
        }
        
        #heatmap {
            width: 100%;
            min-height: 500px;
            position: relative;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
        }
        
        .loading::after {
            content: '';
            width: 40px;
            height: 40px;
            margin-left: 1rem;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .tooltip {
            position: absolute;
            background: rgba(26, 33, 64, 0.98);
            border: 2px solid var(--accent-primary);
            border-radius: 8px;
            padding: 1rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }
        
        .tooltip.show {
            opacity: 1;
        }
        
        .tooltip-label {
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }
        
        .tooltip-value {
            color: var(--accent-primary);
            font-weight: 700;
        }
        
        /* Heatmap specific styles */
        .cell {
            stroke: var(--bg-primary);
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .cell:hover {
            stroke: var(--accent-primary);
            stroke-width: 3;
            filter: brightness(1.2);
        }
        
        .axis text {
            fill: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
        }
        
        .axis line,
        .axis path {
            stroke: var(--border-color);
        }
        
        .legend-title {
            fill: var(--text-primary);
            font-weight: 500;
            font-size: 0.85rem;
        }
        
        .legend-label {
            fill: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
        }
        
        /* Bubble map specific styles */
        .bubble {
            stroke: var(--bg-primary);
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .bubble:hover {
            stroke: var(--accent-primary);
            stroke-width: 3;
            filter: brightness(1.3);
        }
        
        .map-background {
            fill: var(--bg-secondary);
            stroke: var(--border-color);
            stroke-width: 1;
        }
        
        .country {
            fill: var(--bg-card);
            stroke: var(--border-color);
            stroke-width: 0.5;
            transition: fill 0.2s;
        }
        
        .country:hover {
            fill: #252d52;
        }
        
        /* Sankey diagram styles */
        .sankey-node rect {
            fill-opacity: 0.9;
            stroke: var(--border-color);
            stroke-width: 2;
            cursor: pointer;
        }
        
        .sankey-node:hover rect {
            fill-opacity: 1;
            stroke: var(--accent-primary);
            stroke-width: 3;
        }
        
        .sankey-node text {
            fill: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            pointer-events: none;
        }
        
        .sankey-link {
            fill: none;
            stroke-opacity: 0.3;
            cursor: pointer;
        }
        
        .sankey-link:hover {
            stroke-opacity: 0.6;
        }
        
        /* Hide axis controls when not applicable */
        .axis-controls {
            display: flex;
            gap: 2rem;
        }
        
        .axis-controls.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>SSH Event Monitor</h1>
                <p class="subtitle">Real-time security event visualization and analysis</p>
            </div>
            <div class="status-indicator">
                <span class="status-dot" id="wsStatus"></span>
                <span id="wsStatusText">Disconnected</span>
            </div>
        </header>
        
        <div class="controls">
            <div class="control-group">
                <label for="serviceSelect">Service UUID</label>
                <select id="serviceSelect">
                    <option value="">Loading services...</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="timeRange">Time Range</label>
                <select id="timeRange">
                    <option value="1">Last 1 Hour</option>
                    <option value="6">Last 6 Hours</option>
                    <option value="12">Last 12 Hours</option>
                    <option value="24" selected>Last 24 Hours</option>
                    <option value="48">Last 2 Days</option>
                    <option value="168">Last 7 Days</option>
                    <option value="720">Last 30 Days</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="vizType">Visualization Type</label>
                <select id="vizType">
                    <option value="heatmap" selected>Heatmap</option>
                    <option value="sankey">Sankey Diagram</option>
                    <option value="bubblemap">Bubble Map (Geo)</option>
                </select>
            </div>
            
            <div class="axis-controls" id="heatmapControls">
                <div class="control-group">
                    <label for="xAxis">X-Axis</label>
                    <select id="xAxis">
                        <option value="source_ip" selected>IP Address</option>
                        <option value="username">Username</option>
                        <option value="password">Password</option>
                        <option value="source_port">Source Port</option>
                        <option value="auth_methods">Auth Methods</option>
                        <option value="hassh">HASSH</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="yAxis">Y-Axis</label>
                    <select id="yAxis">
                        <option value="username" selected>Username</option>
                        <option value="source_ip">IP Address</option>
                        <option value="password">Password</option>
                        <option value="source_port">Source Port</option>
                        <option value="auth_methods">Auth Methods</option>
                        <option value="hassh">HASSH</option>
                    </select>
                </div>
            </div>
            
            <div class="axis-controls hidden" id="sankeyControls">
                <div class="control-group">
                    <label for="sankeySource">Source</label>
                    <select id="sankeySource">
                        <option value="source_ip" selected>IP Address</option>
                        <option value="username">Username</option>
                        <option value="password">Password</option>
                        <option value="source_port">Source Port</option>
                        <option value="hassh">HASSH</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="sankeyMiddle">Middle</label>
                    <select id="sankeyMiddle">
                        <option value="username" selected>Username</option>
                        <option value="source_ip">IP Address</option>
                        <option value="password">Password</option>
                        <option value="source_port">Source Port</option>
                        <option value="hassh">HASSH</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="sankeyTarget">Target</label>
                    <select id="sankeyTarget">
                        <option value="password" selected>Password</option>
                        <option value="username">Username</option>
                        <option value="source_ip">IP Address</option>
                        <option value="source_port">Source Port</option>
                        <option value="hassh">HASSH</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">Total Events</div>
                <div class="stat-value" id="statTotalEvents">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Unique IPs</div>
                <div class="stat-value" id="statUniqueIPs">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Unique Usernames</div>
                <div class="stat-value" id="statUniqueUsernames">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Unique Fingerprints</div>
                <div class="stat-value" id="statUniqueFingerprints">—</div>
            </div>
        </div>
        
        <div class="visualization-card">
            <h2 id="vizTitle">Username × IP Address Heatmap</h2>
            <div id="heatmap">
                <div class="loading">Initializing visualization</div>
            </div>
        </div>
    </div>
    
    <div class="tooltip" id="tooltip"></div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        const WS_URL = 'ws://localhost:8080/ws';
        
        let ws = null;
        let currentService = null;
        let currentTimeRange = 24;
        let currentXAxis = 'source_ip';
        let currentYAxis = 'username';
        let currentSankeySource = 'source_ip';
        let currentSankeyMiddle = 'username';
        let currentSankeyTarget = 'password';
        let currentVizType = 'heatmap';
        let rawEventData = [];
        
        // Initialize WebSocket
        function initWebSocket() {
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                console.log('WebSocket connected');
                const statusDot = document.querySelector('.status-dot');
                const statusText = document.querySelector('.status-indicator span:last-child');
                if (statusDot) statusDot.classList.add('connected');
                if (statusText) statusText.textContent = 'Connected';
                document.title = '🟢 SSH Event Monitor - Connected';
            };
            
            ws.onclose = () => {
                console.log('WebSocket disconnected');
                const statusDot = document.querySelector('.status-dot');
                const statusText = document.querySelector('.status-indicator span:last-child');
                if (statusDot) statusDot.classList.remove('connected');
                if (statusText) statusText.textContent = 'Disconnected';
                document.title = '🔴 SSH Event Monitor - Disconnected';
                
                // Reconnect after 3 seconds
                setTimeout(initWebSocket, 3000);
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('WebSocket message:', data);
                
                if (data.type === 'connected') {
                    // Connection confirmation from server
                    const statusDot = document.querySelector('.status-dot');
                    const statusText = document.querySelector('.status-indicator span:last-child');
                    if (statusDot) statusDot.classList.add('connected');
                    if (statusText) statusText.textContent = 'Connected';
                    document.title = '🟢 SSH Event Monitor - Connected';
                } else if (data.type === 'new_event') {
                    // Refresh data if it's for the current service
                    if (currentService && data.service_uuid === currentService) {
                        console.log('New event received, refreshing visualization...');
                        loadStats();
                        loadVisualizationData();
                    }
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                const statusDot = document.querySelector('.status-dot');
                const statusText = document.querySelector('.status-indicator span:last-child');
                if (statusDot) statusDot.classList.remove('connected');
                if (statusText) statusText.textContent = 'Error';
                document.title = '⚠️ SSH Event Monitor - Error';
            };
        }
        
        // Load services list
        async function loadServices() {
            try {
                const response = await fetch(`${API_BASE}/services`);
                const services = await response.json();
                
                const select = document.getElementById('serviceSelect');
                select.innerHTML = '<option value="">Select a service...</option>';
                
                services.forEach(service => {
                    const option = document.createElement('option');
                    option.value = service.uuid;
                    option.textContent = `${service.uuid} (${new Date(service.created_at).toLocaleString()})`;
                    select.appendChild(option);
                });
                
                // Auto-select first service if available
                if (services.length > 0) {
                    select.value = services[0].uuid;
                    currentService = services[0].uuid;
                    loadStats();
                    loadVisualizationData();
                }
            } catch (error) {
                console.error('Error loading services:', error);
            }
        }
        
        // Load statistics
        async function loadStats() {
            if (!currentService) return;
            
            try {
                const response = await fetch(`${API_BASE}/stats/${currentService}?hours=${currentTimeRange}`);
                const stats = await response.json();
                
                document.getElementById('statTotalEvents').textContent = stats.total_events.toLocaleString();
                document.getElementById('statUniqueIPs').textContent = stats.unique_ips.toLocaleString();
                document.getElementById('statUniqueUsernames').textContent = stats.unique_usernames.toLocaleString();
                document.getElementById('statUniqueFingerprints').textContent = stats.unique_fingerprints.toLocaleString();
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        // Load visualization data based on current type
        async function loadVisualizationData() {
            if (!currentService) return;
            
            const container = document.getElementById('heatmap');
            container.innerHTML = '<div class="loading">Loading data</div>';
            
            try {
                let endpoint, response;
                
                if (currentVizType === 'bubblemap') {
                    endpoint = `${API_BASE}/bubblemap/${currentService}?hours=${currentTimeRange}`;
                    response = await fetch(endpoint);
                } else if (currentVizType === 'sankey') {
                    endpoint = `${API_BASE}/sankey/${currentService}?hours=${currentTimeRange}&source=${currentSankeySource}&middle=${currentSankeyMiddle}&target=${currentSankeyTarget}`;
                    response = await fetch(endpoint);
                } else {
                    endpoint = `${API_BASE}/heatmap/${currentService}?hours=${currentTimeRange}&x_axis=${currentXAxis}&y_axis=${currentYAxis}`;
                    response = await fetch(endpoint);
                }
                
                const data = await response.json();
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="loading">No data available for selected time range</div>';
                    rawEventData = [];
                    return;
                }
                
                rawEventData = data;
                renderVisualization();
            } catch (error) {
                console.error('Error loading visualization data:', error);
                container.innerHTML = '<div class="loading">Error loading data</div>';
                rawEventData = [];
            }
        }
        
        // Update visualization title and controls visibility
        function updateVizTitle() {
            const heatmapControls = document.getElementById('heatmapControls');
            const sankeyControls = document.getElementById('sankeyControls');
            
            if (currentVizType === 'bubblemap') {
                document.getElementById('vizTitle').textContent = 'Geographic Bubble Map - Attack Origins';
                heatmapControls.classList.add('hidden');
                sankeyControls.classList.add('hidden');
            } else if (currentVizType === 'sankey') {
                const sourceLabel = document.getElementById('sankeySource').selectedOptions[0].textContent;
                const middleLabel = document.getElementById('sankeyMiddle').selectedOptions[0].textContent;
                const targetLabel = document.getElementById('sankeyTarget').selectedOptions[0].textContent;
                document.getElementById('vizTitle').textContent = `${sourceLabel} → ${middleLabel} → ${targetLabel} Flow`;
                heatmapControls.classList.add('hidden');
                sankeyControls.classList.remove('hidden');
            } else {
                const xLabel = document.getElementById('xAxis').selectedOptions[0].textContent;
                const yLabel = document.getElementById('yAxis').selectedOptions[0].textContent;
                document.getElementById('vizTitle').textContent = `${yLabel} × ${xLabel} Heatmap`;
                heatmapControls.classList.remove('hidden');
                sankeyControls.classList.add('hidden');
            }
        }
        
        // Render visualization based on current settings
        function renderVisualization() {
            if (rawEventData.length === 0) {
                document.getElementById('heatmap').innerHTML = '<div class="loading">No data to visualize</div>';
                return;
            }
            
            updateVizTitle();
            
            if (currentVizType === 'bubblemap') {
                renderBubbleMap(rawEventData);
            } else if (currentVizType === 'sankey') {
                renderSankey(rawEventData);
            } else {
                renderHeatmap(rawEventData);
            }
        }
        
        // Render D3.js heatmap
        function renderHeatmap(data) {
            const container = document.getElementById('heatmap');
            container.innerHTML = '';
            
            // API returns data with 'username' (y-axis) and 'source_ip' (x-axis) fields
            // regardless of what actual fields they represent
            const xValues = [...new Set(data.map(d => d.source_ip))].sort();
            const yValues = [...new Set(data.map(d => d.username))].sort();
            
            // Dimensions
            const margin = {top: 80, right: 200, bottom: 100, left: 150};
            const cellSize = 50;
            const width = Math.max(800, xValues.length * cellSize + margin.left + margin.right);
            const height = yValues.length * cellSize + margin.top + margin.bottom;
            
            // Create SVG
            const svg = d3.select('#heatmap')
                .append('svg')
                .attr('width', width)
                .attr('height', height);
            
            const g = svg.append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);
            
            // Create scales
            const xScale = d3.scaleBand()
                .domain(xValues)
                .range([0, xValues.length * cellSize])
                .padding(0.05);
            
            const yScale = d3.scaleBand()
                .domain(yValues)
                .range([0, yValues.length * cellSize])
                .padding(0.05);
            
            const maxCount = d3.max(data, d => d.count);
            
            // Color scale with cyberpunk theme
            const colorScale = d3.scaleSequential()
                .domain([0, maxCount])
                .interpolator(d3.interpolateRgbBasis(['#1a2140', '#7b2cbf', '#ff006e', '#00d9ff']));
            
            // Create data map for quick lookup
            const dataMap = new Map();
            data.forEach(d => {
                dataMap.set(`${d.username}-${d.source_ip}`, d.count);
            });
            
            // Create cells
            yValues.forEach((yValue, yIndex) => {
                xValues.forEach((xValue, xIndex) => {
                    const count = dataMap.get(`${yValue}-${xValue}`) || 0;
                    
                    if (count > 0) {
                        g.append('rect')
                            .attr('class', 'cell')
                            .attr('x', xScale(xValue))
                            .attr('y', yScale(yValue))
                            .attr('width', xScale.bandwidth())
                            .attr('height', yScale.bandwidth())
                            .attr('fill', colorScale(count))
                            .attr('opacity', 0)
                            .on('mouseover', function(event) {
                                showTooltip(event, yValue, xValue, count);
                            })
                            .on('mouseout', hideTooltip)
                            .transition()
                            .duration(500)
                            .delay((yIndex * xValues.length + xIndex) * 10)
                            .attr('opacity', 1);
                    }
                });
            });
            
            // X axis
            g.append('g')
                .attr('class', 'axis')
                .attr('transform', `translate(0,${yValues.length * cellSize})`)
                .call(d3.axisBottom(xScale))
                .selectAll('text')
                .attr('transform', 'rotate(-45)')
                .style('text-anchor', 'end');
            
            // Y axis
            g.append('g')
                .attr('class', 'axis')
                .call(d3.axisLeft(yScale));
            
            // Add legend
            const legendWidth = 20;
            const legendHeight = 200;
            const legendX = xValues.length * cellSize + 40;
            const legendY = 0;
            
            const legendScale = d3.scaleLinear()
                .domain([0, maxCount])
                .range([legendHeight, 0]);
            
            const legendAxis = d3.axisRight(legendScale)
                .ticks(5)
                .tickFormat(d => d.toLocaleString());
            
            const legend = g.append('g')
                .attr('transform', `translate(${legendX},${legendY})`);
            
            // Legend gradient
            const defs = svg.append('defs');
            const gradient = defs.append('linearGradient')
                .attr('id', 'legend-gradient')
                .attr('x1', '0%')
                .attr('y1', '100%')
                .attr('x2', '0%')
                .attr('y2', '0%');
            
            gradient.selectAll('stop')
                .data(d3.range(0, 1.01, 0.1))
                .enter()
                .append('stop')
                .attr('offset', d => `${d * 100}%`)
                .attr('stop-color', d => colorScale(d * maxCount));
            
            legend.append('rect')
                .attr('width', legendWidth)
                .attr('height', legendHeight)
                .style('fill', 'url(#legend-gradient)');
            
            legend.append('g')
                .attr('class', 'axis')
                .attr('transform', `translate(${legendWidth},0)`)
                .call(legendAxis);
            
            legend.append('text')
                .attr('class', 'legend-title')
                .attr('x', 0)
                .attr('y', -10)
                .text('Attempts');
        }
        
        // Render D3.js Bubble Map
        async function renderBubbleMap(data) {
            const container = document.getElementById('heatmap');
            container.innerHTML = '';
            
            // Dimensions
            const margin = {top: 20, right: 200, bottom: 20, left: 20};
            const width = 1400 - margin.left - margin.right;
            const height = 700 - margin.top - margin.bottom;
            
            // Create SVG
            const svg = d3.select('#heatmap')
                .append('svg')
                .attr('width', width + margin.left + margin.right)
                .attr('height', height + margin.top + margin.bottom);
            
            const g = svg.append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);
            
            // Create projection
            const projection = d3.geoNaturalEarth1()
                .scale(200)
                .translate([width / 2, height / 2]);
            
            const path = d3.geoPath().projection(projection);
            
            // Draw world map background
            g.append('rect')
                .attr('class', 'map-background')
                .attr('width', width)
                .attr('height', height);
            
            // Load world map TopoJSON
            try {
                const world = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
                const countries = topojson.feature(world, world.objects.countries);
                
                // Draw countries
                g.selectAll('.country')
                    .data(countries.features)
                    .enter()
                    .append('path')
                    .attr('class', 'country')
                    .attr('d', path)
                    .style('fill', 'var(--bg-secondary)')
                    .style('stroke', 'var(--border-color)')
                    .style('stroke-width', 0.5);
                    
            } catch (error) {
                console.warn('Could not load world map, using sphere fallback:', error);
                // Fallback to sphere if TopoJSON fails to load
                g.append('path')
                    .datum({type: 'Sphere'})
                    .attr('class', 'country')
                    .attr('d', path)
                    .style('fill', 'var(--bg-secondary)')
                    .style('stroke', 'var(--border-color)');
            }
            
            // Draw graticule (grid lines)
            const graticule = d3.geoGraticule();
            g.append('path')
                .datum(graticule)
                .attr('d', path)
                .style('fill', 'none')
                .style('stroke', 'var(--border-color)')
                .style('stroke-width', 0.5)
                .style('opacity', 0.3);
            
            // Scale for bubble size
            const maxCount = d3.max(data, d => d.count);
            const sizeScale = d3.scaleSqrt()
                .domain([0, maxCount])
                .range([3, 30]);
            
            // Color scale
            const colorScale = d3.scaleSequential()
                .domain([0, maxCount])
                .interpolator(d3.interpolateRgbBasis(['#7b2cbf', '#ff006e', '#00d9ff']));
            
            // Draw bubbles
            const bubbles = g.selectAll('.bubble')
                .data(data)
                .enter()
                .append('circle')
                .attr('class', 'bubble')
                .attr('cx', d => {
                    const coords = projection([d.longitude, d.latitude]);
                    return coords ? coords[0] : 0;
                })
                .attr('cy', d => {
                    const coords = projection([d.longitude, d.latitude]);
                    return coords ? coords[1] : 0;
                })
                .attr('r', 0)
                .attr('fill', d => colorScale(d.count))
                .attr('opacity', 0.7)
                .on('mouseover', function(event, d) {
                    showBubbleTooltip(event, d);
                })
                .on('mouseout', hideTooltip);
            
            // Animate bubbles
            bubbles.transition()
                .duration(800)
                .delay((d, i) => i * 20)
                .attr('r', d => sizeScale(d.count));
            
            // Add legend
            const legendWidth = 20;
            const legendHeight = 200;
            const legendX = width + 40;
            const legendY = 50;
            
            const legendScale = d3.scaleLinear()
                .domain([0, maxCount])
                .range([legendHeight, 0]);
            
            const legendAxis = d3.axisRight(legendScale)
                .ticks(5)
                .tickFormat(d => d.toLocaleString());
            
            const legend = g.append('g')
                .attr('transform', `translate(${legendX},${legendY})`);
            
            // Legend gradient
            const defs = svg.append('defs');
            const gradient = defs.append('linearGradient')
                .attr('id', 'bubble-legend-gradient')
                .attr('x1', '0%')
                .attr('y1', '100%')
                .attr('x2', '0%')
                .attr('y2', '0%');
            
            gradient.selectAll('stop')
                .data(d3.range(0, 1.01, 0.1))
                .enter()
                .append('stop')
                .attr('offset', d => `${d * 100}%`)
                .attr('stop-color', d => colorScale(d * maxCount));
            
            legend.append('rect')
                .attr('width', legendWidth)
                .attr('height', legendHeight)
                .style('fill', 'url(#bubble-legend-gradient)');
            
            legend.append('g')
                .attr('class', 'axis')
                .attr('transform', `translate(${legendWidth},0)`)
                .call(legendAxis);
            
            legend.append('text')
                .attr('class', 'legend-title')
                .attr('x', 0)
                .attr('y', -10)
                .text('Attempts');
        }
        
        // Render D3.js Sankey Diagram
        function renderSankey(data) {
            const container = document.getElementById('heatmap');
            container.innerHTML = '';
            
            // Dimensions
            const margin = {top: 40, right: 200, bottom: 40, left: 200};
            const width = 1400 - margin.left - margin.right;
            const height = 700 - margin.top - margin.bottom;
            
            // Create SVG
            const svg = d3.select('#heatmap')
                .append('svg')
                .attr('width', width + margin.left + margin.right)
                .attr('height', height + margin.top + margin.bottom);
            
            const g = svg.append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);
            
            // Process data into Sankey format
            // Data comes as: {source: "value1", middle: "value2", target: "value3", count: N}
            const nodes = new Map();
            const links = [];
            let nodeIndex = 0;
            
            // Helper to get or create node
            const getNodeIndex = (name, layer) => {
                const key = `${layer}:${name}`;
                if (!nodes.has(key)) {
                    nodes.set(key, {
                        index: nodeIndex++,
                        name: name,
                        layer: layer,
                        key: key
                    });
                }
                return nodes.get(key).index;
            };
            
            // Build nodes and links from data
            data.forEach(d => {
                const sourceIdx = getNodeIndex(d.source, 0);
                const middleIdx = getNodeIndex(d.middle, 1);
                const targetIdx = getNodeIndex(d.target, 2);
                
                // Source -> Middle
                links.push({
                    source: sourceIdx,
                    target: middleIdx,
                    value: d.count
                });
                
                // Middle -> Target
                links.push({
                    source: middleIdx,
                    target: targetIdx,
                    value: d.count
                });
            });
            
            // Convert nodes map to array
            const nodeArray = Array.from(nodes.values()).map(n => ({
                name: n.name,
                layer: n.layer
            }));
            
            // Create Sankey layout
            const sankey = d3.sankey()
                .nodeWidth(20)
                .nodePadding(15)
                .extent([[0, 0], [width, height]])
                .nodeId(d => d.index)
                .nodeAlign(d3.sankeyJustify);
            
            // Generate the sankey diagram
            const {nodes: sankeyNodes, links: sankeyLinks} = sankey({
                nodes: nodeArray.map((d, i) => ({...d, index: i})),
                links: links
            });
            
            // Color scale for nodes by layer
            const colorScale = d3.scaleOrdinal()
                .domain([0, 1, 2])
                .range(['#00d9ff', '#7b2cbf', '#ff006e']);
            
            // Draw links
            g.append('g')
                .selectAll('.sankey-link')
                .data(sankeyLinks)
                .enter()
                .append('path')
                .attr('class', 'sankey-link')
                .attr('d', d3.sankeyLinkHorizontal())
                .attr('stroke', d => colorScale(d.source.layer))
                .attr('stroke-width', d => Math.max(1, d.width))
                .on('mouseover', function(event, d) {
                    showSankeyTooltip(event, d);
                })
                .on('mouseout', hideTooltip);
            
            // Draw nodes
            const node = g.append('g')
                .selectAll('.sankey-node')
                .data(sankeyNodes)
                .enter()
                .append('g')
                .attr('class', 'sankey-node')
                .attr('transform', d => `translate(${d.x0},${d.y0})`);
            
            node.append('rect')
                .attr('width', d => d.x1 - d.x0)
                .attr('height', d => d.y1 - d.y0)
                .attr('fill', d => colorScale(d.layer))
                .on('mouseover', function(event, d) {
                    showSankeyNodeTooltip(event, d);
                })
                .on('mouseout', hideTooltip);
            
            // Add labels
            node.append('text')
                .attr('x', d => (d.x1 - d.x0) / 2)
                .attr('y', d => (d.y1 - d.y0) / 2)
                .attr('dy', '0.35em')
                .attr('text-anchor', 'middle')
                .text(d => d.name.length > 15 ? d.name.substring(0, 12) + '...' : d.name)
                .style('font-size', '11px');
            
            // Add layer labels
            const layerLabels = [
                {layer: 0, label: document.getElementById('sankeySource').selectedOptions[0].textContent},
                {layer: 1, label: document.getElementById('sankeyMiddle').selectedOptions[0].textContent},
                {layer: 2, label: document.getElementById('sankeyTarget').selectedOptions[0].textContent}
            ];
            
            layerLabels.forEach(({layer, label}) => {
                const layerNodes = sankeyNodes.filter(n => n.layer === layer);
                if (layerNodes.length > 0) {
                    const x = layer === 0 ? 0 : (layer === 1 ? width / 2 : width);
                    g.append('text')
                        .attr('x', x)
                        .attr('y', -15)
                        .attr('text-anchor', 'middle')
                        .attr('class', 'legend-title')
                        .style('fill', colorScale(layer))
                        .style('font-size', '14px')
                        .style('font-weight', 'bold')
                        .text(label);
                }
            });
        }
        
        // Sankey tooltip functions
        function showSankeyTooltip(event, d) {
            const tooltip = document.getElementById('tooltip');
            
            tooltip.innerHTML = `
                <div class="tooltip-label">Flow:</div>
                <div class="tooltip-value">${d.source.name} → ${d.target.name}</div>
                <div class="tooltip-label" style="margin-top: 0.5rem;">Count:</div>
                <div class="tooltip-value">${d.value.toLocaleString()}</div>
            `;
            
            tooltip.style.left = (event.pageX + 15) + 'px';
            tooltip.style.top = (event.pageY - 15) + 'px';
            tooltip.classList.add('show');
        }
        
        function showSankeyNodeTooltip(event, d) {
            const tooltip = document.getElementById('tooltip');
            
            const totalValue = (d.sourceLinks || []).reduce((sum, l) => sum + l.value, 0) +
                             (d.targetLinks || []).reduce((sum, l) => sum + l.value, 0);
            
            tooltip.innerHTML = `
                <div class="tooltip-label">Node:</div>
                <div class="tooltip-value">${d.name}</div>
                <div class="tooltip-label" style="margin-top: 0.5rem;">Total Flow:</div>
                <div class="tooltip-value">${(totalValue / 2).toLocaleString()}</div>
            `;
            
            tooltip.style.left = (event.pageX + 15) + 'px';
            tooltip.style.top = (event.pageY - 15) + 'px';
            tooltip.classList.add('show');
        }
        
        // Bubble tooltip functions
        function showBubbleTooltip(event, d) {
            const tooltip = document.getElementById('tooltip');
            
            tooltip.innerHTML = `
                <div class="tooltip-label">Username:</div>
                <div class="tooltip-value">${d.username}</div>
                <div class="tooltip-label">Password:</div>
                <div class="tooltip-value">${d.password}</div>
                <div class="tooltip-label">Source IP:</div>
                <div class="tooltip-value">${d.source_ip}</div>
                <div class="tooltip-label" style="margin-top: 0.5rem;">Attempts:</div>
                <div class="tooltip-value">${d.count.toLocaleString()}</div>
            `;
            
            tooltip.style.left = (event.pageX + 15) + 'px';
            tooltip.style.top = (event.pageY - 15) + 'px';
            tooltip.classList.add('show');
        }
        
        // Tooltip functions
        function showTooltip(event, yValue, xValue, count) {
            const tooltip = document.getElementById('tooltip');
            const yLabel = document.getElementById('yAxis').selectedOptions[0].textContent;
            const xLabel = document.getElementById('xAxis').selectedOptions[0].textContent;
            
            tooltip.innerHTML = `
                <div class="tooltip-label">${yLabel}:</div>
                <div class="tooltip-value">${yValue}</div>
                <div class="tooltip-label">${xLabel}:</div>
                <div class="tooltip-value">${xValue}</div>
                <div class="tooltip-label" style="margin-top: 0.5rem;">Count:</div>
                <div class="tooltip-value">${count.toLocaleString()}</div>
            `;
            
            tooltip.style.left = (event.pageX + 15) + 'px';
            tooltip.style.top = (event.pageY - 15) + 'px';
            tooltip.classList.add('show');
        }
        
        function hideTooltip() {
            document.getElementById('tooltip').classList.remove('show');
        }

        document.getElementById('serviceSelect').addEventListener('change', (e) => {
            currentService = e.target.value;
            if (currentService) {
                loadStats();
                loadVisualizationData();
            }
        });
        
        document.getElementById('timeRange').addEventListener('change', (e) => {
            currentTimeRange = parseInt(e.target.value);
            if (currentService) {
                loadStats();
                loadVisualizationData();
            }
        });
        
        document.getElementById('vizType').addEventListener('change', (e) => {
            currentVizType = e.target.value;
            if (currentService) {
                loadVisualizationData();
            }
        });
        
        document.getElementById('xAxis').addEventListener('change', (e) => {
            currentXAxis = e.target.value;
            // Prevent same axis on both X and Y
            if (currentXAxis === currentYAxis) {
                // Swap to another axis
                const ySelect = document.getElementById('yAxis');
                const options = Array.from(ySelect.options);

                const otherOption = options.find(opt => opt.value !== currentYAxis);

            if (currentSankeySource === currentSankeyMiddle) {

                const otherOption = options.find(opt => opt.value !== currentSankeySource && opt.value !== currentSankeyTarget);
                if (otherOption) {

                const options = Array.from(document.getElementById('sankeyTarget').options);
                const otherOption = options.find(opt => opt.value !== currentSankeySource && opt.value !== currentSankeyMiddle);
                if (otherOption) {

                    currentSankeyTarget = otherOption.value;
                }
            }
            if (currentService && currentVizType === 'sankey') {

        document.getElementById('sankeyMiddle').addEventListener('change', (e) => {
            currentSankeyMiddle = e.target.value;
            // Prevent duplicate fields
            if (currentSankeyMiddle === currentSankeySource) {
                const options = Array.from(document.getElementById('sankeySource').options);
                const otherOption = options.find(opt => opt.value !== currentSankeyMiddle && opt.value !== currentSankeyTarget);
                if (otherOption) {
                    document.getElementById('sankeySource').value = otherOption.value;

            if (currentSankeyMiddle === currentSankeyTarget) {
                const options = Array.from(document.getElementById('sankeyTarget').options);
                const otherOption = options.find(opt => opt.value !== currentSankeyMiddle && opt.value !== currentSankeySource);
                if (otherOption) {
                    document.getElementById('sankeyTarget').value = otherOption.value;
                    currentSankeyTarget = otherOption.value;
                }
            }
            if (currentService && currentVizType === 'sankey') {

        document.getElementById('sankeyTarget').addEventListener('change', (e) => {

            // Prevent duplicate fields
            if (currentSankeyTarget === currentSankeySource) {

                if (otherOption) {

                if (otherOption) {
                    document.getElementById('sankeyMiddle').value = otherOption.value;
                    currentSankeyMiddle = otherOption.value;
                }
            }
            if (currentService && currentVizType === 'sankey') {

            }
        });
        
        // Initialize

        loadServices();
        
        // Set initial title to match dropdown defaults
